# Render Blueprint for the live game server (free plan, no payment method needed).
services:
  - type: web
    name: dot-arena
    runtime: node
    region: singapore        # closest Render region to Korean viewers
    plan: free
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass   # deploy only after GitHub Actions passes
    envVars:
      - key: NODE_VERSION
        value: "22"

