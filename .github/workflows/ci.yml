name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Load smoke test (500 players, one round)
        run: |
          PORT=3000 node server.js &
          for i in $(seq 1 20); do curl -sf localhost:3000/healthz && break; sleep 0.5; done
          node scripts/load.js http://localhost:3000 500
